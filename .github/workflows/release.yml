name: Package Theme Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Package and verify archive
        shell: bash
        run: ./scripts/package.sh

      - name: Verify default basis release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          basis_package_id="$(jq -r '.basis.packageId' operit-theme.json)"
          basis_version="$(jq -r '.basis.version' operit-theme.json)"
          basis_archive_sha="$(jq -r '.basis.archiveSha256' operit-theme.json)"
          test "$basis_package_id" = operit.default
          basis_archive="operit-default-${basis_version}.otheme"
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT
          gh release download "v${basis_version}" \
            --repo luojiaping/operit-theme-default \
            --pattern "$basis_archive" \
            --dir "$tmpdir"
          actual_sha="$(sha256sum "$tmpdir/$basis_archive" | cut -d ' ' -f 1)"
          test "$actual_sha" = "$basis_archive_sha"

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          package_id="$(jq -r '.packageId' operit-theme.json)"
          version="$(jq -r '.version' operit-theme.json)"
          test "$tag" = "v${version}"
          basis_package_id="$(jq -r '.basis.packageId' operit-theme.json)"
          basis_version="$(jq -r '.basis.version' operit-theme.json)"
          basis_archive_sha="$(jq -r '.basis.archiveSha256' operit-theme.json)"
          archive_prefix="$(printf '%s' "$package_id" | tr '._' '-')"
          archive="dist/${archive_prefix}-${version}.otheme"
          read -r archive_sha _ < "$archive.sha256"
          notes="$(printf 'Theme package: %s@%s\n\nBasis: %s@%s\nBasis archive SHA-256: %s\n\nArchive SHA-256: %s\n' "$package_id" "$version" "$basis_package_id" "$basis_version" "$basis_archive_sha" "$archive_sha")"
          gh release create "$tag" "$archive" "$archive.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$tag" \
            --notes "$notes"
